# Альтернатива кореневому стеку: лише MySQL + backend.
# Імена й хостові порти ті самі, що в кореневому compose, тож цей файл
# не конфліктує з v1 і не стартує паралельно з уже запущеним кореневим v5.
name: tms-geosun-v5-backend

services:
  mysql:
    image: mysql:8.0
    container_name: tms-v5-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tms_auth}
      MYSQL_USER: ${MYSQL_USER:-tms_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tms_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    # Зовнішній порт (ліворуч) — щоб не конфліктувати з локальним MySQL на 3306
    ports:
      - "${MYSQL_HOST_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER:-tms_user}", "-p${MYSQL_PASSWORD:-tms_password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tms-v5-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # Усередині контейнера завжди 8080. На хост — SERVER_HOST_PORT (v1 тримає 8080).
      SERVER_PORT: "8080"
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-tms_auth}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: ${MYSQL_USER:-tms_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-tms_password}
      JWT_SECRET: ${JWT_SECRET:-replace-me-with-strong-secret-of-at-least-32-characters}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      JWT_EXPIRES_SECONDS: ${JWT_EXPIRES_SECONDS:-900}
      JWT_REFRESH_EXPIRES_SECONDS: ${JWT_REFRESH_EXPIRES_SECONDS:-604800}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      EMAIL_VERIFICATION_EXPIRES_SECONDS: ${EMAIL_VERIFICATION_EXPIRES_SECONDS:-86400}
      ANGULAR_APP_BASE_URL: ${ANGULAR_APP_BASE_URL:-http://localhost:4210}
      FLUTTER_APP_BASE_URL: ${FLUTTER_APP_BASE_URL:-http://localhost:4300}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@example.com}
      MAIL_SITE_URL: ${MAIL_SITE_URL:-https://www.geosun.net.ua}
      MAIL_PHONE: "${MAIL_PHONE:-+380(98)4894118}"
      MAIL_TELEGRAM_URL: ${MAIL_TELEGRAM_URL:-https://t.me/+380984894118}
      MAIL_WHATSAPP_URL: ${MAIL_WHATSAPP_URL:-https://wa.me/380984894118}
      MAIL_VIBER_URL: ${MAIL_VIBER_URL:-https://viber.me/380984894118}
      MAIL_FACEBOOK_URL: ${MAIL_FACEBOOK_URL:-https://www.facebook.com/profile.php?id=100063988064019}
      RATE_LIMIT_LOGIN_MAX_ATTEMPTS: ${RATE_LIMIT_LOGIN_MAX_ATTEMPTS:-5}
      RATE_LIMIT_LOGIN_WINDOW_SECONDS: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:-900}
      RATE_LIMIT_RESEND_VERIFICATION_SECONDS: ${RATE_LIMIT_RESEND_VERIFICATION_SECONDS:-60}
      RATE_LIMIT_REFRESH_MAX_REQUESTS: ${RATE_LIMIT_REFRESH_MAX_REQUESTS:-30}
      RATE_LIMIT_REFRESH_WINDOW_SECONDS: ${RATE_LIMIT_REFRESH_WINDOW_SECONDS:-60}
      TOKEN_CLEANUP_RETENTION_DAYS: ${TOKEN_CLEANUP_RETENTION_DAYS:-30}
      HERE_API_KEY: ${HERE_API_KEY:-}
      COUNTRY_BREAKDOWN_PROVIDER: ${COUNTRY_BREAKDOWN_PROVIDER:-here}
    ports:
      - "${SERVER_HOST_PORT:-8090}:8080"

volumes:
  mysql_data:
    name: tms-geosun-v5_mysql_data
