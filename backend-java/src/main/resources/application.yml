spring:
  application:
    name: tms-geosun-backend-java
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tms_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:tms_user}
    password: ${DB_PASSWORD:tms_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    build:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  show-actuator: true
  override-with-generic-response: false

app:
  info:
    api-version: v1
    repository-url: ${APP_REPOSITORY_URL:https://github.com/developer-geosun/tms-geosun-v4.git}
  # Режим публічного доступу (інформаційно; тунель керує Docker Compose-профіль ngrok).
  public-access:
    mode: ${PUBLIC_ACCESS_MODE:static-ip}
    url: ${PUBLIC_API_URL:}
  cors:
    allowed-origin-patterns-extra: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
  security:
    jwt:
      secret: ${JWT_SECRET:replace-me-with-strong-secret-of-at-least-32-characters}
      issuer: ${JWT_ISSUER:}
      audience: ${JWT_AUDIENCE:}
      expires-seconds: ${JWT_EXPIRES_SECONDS:900}
      refresh-expires-seconds: ${JWT_REFRESH_EXPIRES_SECONDS:604800}
      refresh-reuse-grace-seconds: ${JWT_REFRESH_REUSE_GRACE_SECONDS:15}
    # Пароль суперадміна для чутливих admin-операцій (не обліковий запис користувача).
    super-admin:
      password: ${SUPER_ADMIN_PASSWORD:}
  bootstrap:
    admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
    platform-operator:
      email: ${PLATFORM_OPERATOR_EMAIL:}
      password: ${PLATFORM_OPERATOR_PASSWORD:}
  enterprise:
    default-code: ${DEFAULT_ENTERPRISE_CODE:}
    default-name: ${DEFAULT_ENTERPRISE_NAME:}
  email:
    from: ${MAIL_FROM:no-reply@example.com}
    verification-expires-seconds: ${EMAIL_VERIFICATION_EXPIRES_SECONDS:86400}
    password-reset-expires-seconds: ${PASSWORD_RESET_EXPIRES_SECONDS:3600}
    # Базові URL frontend (локально або GitHub Pages), не ngrok API.
    # Шляхи /verify-email і /reset-password додаються автоматично залежно від X-App-Client.
    angular-app-base-url: ${ANGULAR_APP_BASE_URL:http://localhost:4200}
    flutter-app-base-url: ${FLUTTER_APP_BASE_URL:http://localhost:4300}
    site-url: ${MAIL_SITE_URL:https://www.geosun.net.ua}
    phone: "${MAIL_PHONE:+380(98)4894118}"
    telegram-url: "${MAIL_TELEGRAM_URL:https://t.me/+380984894118}"
    whatsapp-url: ${MAIL_WHATSAPP_URL:https://wa.me/380984894118}
    viber-url: "${MAIL_VIBER_URL:https://viber.me/380984894118}"
    facebook-url: ${MAIL_FACEBOOK_URL:https://www.facebook.com/profile.php?id=100063988064019}
  rate-limit:
    login-max-attempts: ${RATE_LIMIT_LOGIN_MAX_ATTEMPTS:5}
    login-window-seconds: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:900}
    resend-verification-seconds: ${RATE_LIMIT_RESEND_VERIFICATION_SECONDS:60}
    forgot-password-seconds: ${RATE_LIMIT_FORGOT_PASSWORD_SECONDS:60}
    refresh-max-requests: ${RATE_LIMIT_REFRESH_MAX_REQUESTS:30}
    refresh-window-seconds: ${RATE_LIMIT_REFRESH_WINDOW_SECONDS:60}
    register-max-per-window: ${RATE_LIMIT_REGISTER_MAX_PER_WINDOW:30}
    chatbot-webhook-max-requests: ${RATE_LIMIT_CHATBOT_WEBHOOK_MAX:120}
    chatbot-webhook-window-seconds: ${RATE_LIMIT_CHATBOT_WEBHOOK_WINDOW:60}
  cleanup:
    token-retention-days: ${TOKEN_CLEANUP_RETENTION_DAYS:30}
    cron: ${TOKEN_CLEANUP_CRON:0 0 2 * * *}
  notifications:
    user-registered:
      enabled: ${APP_NOTIFY_USER_REGISTERED_ENABLED:true}
    freight-request-created:
      enabled: ${APP_NOTIFY_FREIGHT_REQUEST_CREATED_ENABLED:true}
  sms:
    enabled: ${APP_SMS_ENABLED:false}
    provider: ${APP_SMS_PROVIDER:none}
  chatbot:
    enabled: ${CHATBOT_ENABLED:false}
    public-base-url: ${CHATBOT_PUBLIC_BASE_URL:}
    cleanup-retention-days: ${CHATBOT_CLEANUP_RETENTION_DAYS:90}
    telegram:
      enabled: ${CHATBOT_TELEGRAM_ENABLED:false}
      bot-token: ${CHATBOT_TELEGRAM_BOT_TOKEN:}
      secret-token: ${CHATBOT_TELEGRAM_SECRET_TOKEN:}
      bot-username: ${CHATBOT_TELEGRAM_BOT_USERNAME:}
      timeout-millis: ${CHATBOT_TELEGRAM_TIMEOUT_MILLIS:10000}
  here:
    api-key: ${HERE_API_KEY:}
    base-url: ${HERE_BASE_URL:https://router.hereapi.com}
    transport-mode: ${HERE_TRANSPORT_MODE:truck}
    routing-mode: ${HERE_ROUTING_MODE:fast}
    timeout-millis: ${HERE_TIMEOUT_MILLIS:5000}
    cache-ttl-seconds: ${HERE_CACHE_TTL_SECONDS:86400}
  country-breakdown:
    provider: ${COUNTRY_BREAKDOWN_PROVIDER:here}
  nbu:
    base-url: ${NBU_API_BASE_URL:https://bank.gov.ua/NBUStatService/v1/statdirectory}
    timeout-millis: ${NBU_API_TIMEOUT_MILLIS:10000}
    max-lookback-days: ${NBU_MAX_LOOKBACK_DAYS:14}
  storage:
    type: ${APP_STORAGE_TYPE:local}
    local:
      base-path: ${APP_STORAGE_LOCAL_BASE_PATH:./data/uploads}
    s3:
      endpoint: ${APP_STORAGE_S3_ENDPOINT:}
      region: ${APP_STORAGE_S3_REGION:us-east-1}
      bucket: ${APP_STORAGE_S3_BUCKET:tms-uploads}
      access-key: ${APP_STORAGE_S3_ACCESS_KEY:}
      secret-key: ${APP_STORAGE_S3_SECRET_KEY:}
      path-style-access: ${APP_STORAGE_S3_PATH_STYLE:true}
