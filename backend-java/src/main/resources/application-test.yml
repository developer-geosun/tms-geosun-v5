spring:
  task:
    scheduling:
      enabled: false
  datasource:
    url: jdbc:h2:mem:tms_auth_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  security:
    jwt:
      secret: test-jwt-secret-must-be-at-least-32-bytes-long!!
      refresh-reuse-grace-seconds: 0
    super-admin:
      password: test-super-admin-password
  bootstrap:
    admin:
      email:
      password:
    platform-operator:
      email:
      password:
  enterprise:
    default-code:
    default-name:
  storage:
    type: local
    local:
      base-path: ./target/test-uploads

management:
  health:
    mail:
      enabled: false

logging:
  level:
    root: WARN
    com.geosun.tms: INFO
