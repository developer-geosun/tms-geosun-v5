## Додаткові сервіси для локальної розробки (профіль dev)
services:
  # Angular dev-server з hot reload і монтуванням локального коду
  frontend-dev:
    profiles:
      - dev
    image: node:22.14-alpine
    container_name: tms-v5-frontend-dev
    working_dir: /app
    depends_on:
      - backend
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      CARTO_API_KEY: ${CARTO_API_KEY:-}
    volumes:
      - ./frontend-angular:/app
      - frontend_node_modules:/app/node_modules
    # Порожній том — npm ci. Змінений lockfile — npm install (без зносу node_modules).
    command:
      - sh
      - -c
      - |
        LOCK_HASH=$$(md5sum package-lock.json | cut -d' ' -f1)
        if [ ! -d node_modules ] || [ -z "$$(ls -A node_modules 2>/dev/null)" ]; then
          npm ci
          echo "$$LOCK_HASH" > node_modules/.package-lock-hash
        elif [ ! -f node_modules/.package-lock-hash ] || [ "$$(cat node_modules/.package-lock-hash)" != "$$LOCK_HASH" ]; then
          npm install
          echo "$$LOCK_HASH" > node_modules/.package-lock-hash
        fi
        npm run start -- --host 0.0.0.0 --port 4200 --poll 1000 --proxy-config proxy.docker.conf.json --allowed-hosts all
    ports:
      - "${FRONTEND_PORT:-4210}:4200"

  # Dev gateway з окремим nginx-конфігом для маршрутизації у dev-режимі
  gateway-dev:
    profiles:
      - dev
    image: nginx:1.27-alpine
    container_name: tms-v5-gateway-dev
    depends_on:
      - backend
      - frontend-dev
    volumes:
      - ./nginx.gateway.dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${GATEWAY_DEV_PORT:-8092}:80"

  # Окремий ngrok-тунель для dev (профіль ngrok-dev, щоб не дублювати сервіс ngrok)
  ngrok-dev:
    profiles:
      - ngrok-dev
    image: ngrok/ngrok:latest
    container_name: tms-v5-ngrok-dev
    depends_on:
      - backend
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command: http --url=${NGROK_DOMAIN} backend:8080
    ports:
      - "${NGROK_DEV_INSPECT_PORT:-4043}:4040"

volumes:
  # Окремий том для node_modules, щоб не перевстановлювати залежності щоразу
  frontend_node_modules:
