## Базовий стек для стандартного запуску застосунку.
## Хостові порти й імена контейнерів не перетинаються з tms-geosun-v1,
## тож обидва стеки можна тримати запущеними разом. Усередині мережі Compose
## порти колишні (backend 8080, MySQL 3306). База v5 — окремий volume mysql_data.
name: tms-geosun-v5

services:
  # База даних для backend-сервісу авторизації
  mysql:
    image: mysql:8.0
    container_name: tms-v5-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tms_auth}
      MYSQL_USER: ${MYSQL_USER:-tms_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tms_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_HOST_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER:-tms_user}", "-p${MYSQL_PASSWORD:-tms_password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # MinIO (S3-сумісне сховище) — опційно для APP_STORAGE_TYPE=s3
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: tms-v5-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Створення bucket для MinIO (одноразово при старті)
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: tms-v5-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/$${APP_STORAGE_S3_BUCKET:-tms-uploads};
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      APP_STORAGE_S3_BUCKET: ${APP_STORAGE_S3_BUCKET:-tms-uploads}

  # Spring Boot API (auth/backend)
  backend:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: tms-v5-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # Усередині мережі Compose завжди 8080 (nginx, ngrok, proxy.docker).
      # На хост цей порт публікує SERVER_HOST_PORT, щоб не займати 8080 разом із v1.
      SERVER_PORT: "8080"
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-tms_auth}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: ${MYSQL_USER:-tms_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-tms_password}
      JWT_SECRET: ${JWT_SECRET:-replace-me-with-strong-secret-of-at-least-32-characters}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      JWT_EXPIRES_SECONDS: ${JWT_EXPIRES_SECONDS:-900}
      JWT_REFRESH_EXPIRES_SECONDS: ${JWT_REFRESH_EXPIRES_SECONDS:-604800}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      EMAIL_VERIFICATION_EXPIRES_SECONDS: ${EMAIL_VERIFICATION_EXPIRES_SECONDS:-86400}
      ANGULAR_APP_BASE_URL: ${ANGULAR_APP_BASE_URL:-http://localhost:4210}
      FLUTTER_APP_BASE_URL: ${FLUTTER_APP_BASE_URL:-http://localhost:4300}
      PASSWORD_RESET_EXPIRES_SECONDS: ${PASSWORD_RESET_EXPIRES_SECONDS:-3600}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@example.com}
      MAIL_SITE_URL: ${MAIL_SITE_URL:-https://www.geosun.net.ua}
      MAIL_PHONE: "${MAIL_PHONE:-+380(98)4894118}"
      MAIL_TELEGRAM_URL: ${MAIL_TELEGRAM_URL:-https://t.me/+380984894118}
      MAIL_WHATSAPP_URL: ${MAIL_WHATSAPP_URL:-https://wa.me/380984894118}
      MAIL_VIBER_URL: ${MAIL_VIBER_URL:-https://viber.me/380984894118}
      MAIL_FACEBOOK_URL: ${MAIL_FACEBOOK_URL:-https://www.facebook.com/profile.php?id=100063988064019}
      RATE_LIMIT_LOGIN_MAX_ATTEMPTS: ${RATE_LIMIT_LOGIN_MAX_ATTEMPTS:-5}
      RATE_LIMIT_LOGIN_WINDOW_SECONDS: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:-900}
      RATE_LIMIT_RESEND_VERIFICATION_SECONDS: ${RATE_LIMIT_RESEND_VERIFICATION_SECONDS:-60}
      RATE_LIMIT_FORGOT_PASSWORD_SECONDS: ${RATE_LIMIT_FORGOT_PASSWORD_SECONDS:-60}
      RATE_LIMIT_REFRESH_MAX_REQUESTS: ${RATE_LIMIT_REFRESH_MAX_REQUESTS:-30}
      RATE_LIMIT_REFRESH_WINDOW_SECONDS: ${RATE_LIMIT_REFRESH_WINDOW_SECONDS:-60}
      TOKEN_CLEANUP_RETENTION_DAYS: ${TOKEN_CLEANUP_RETENTION_DAYS:-30}
      HERE_API_KEY: ${HERE_API_KEY:-}
      COUNTRY_BREAKDOWN_PROVIDER: ${COUNTRY_BREAKDOWN_PROVIDER:-here}
      PUBLIC_ACCESS_MODE: ${PUBLIC_ACCESS_MODE:-static-ip}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      CHATBOT_ENABLED: ${CHATBOT_ENABLED:-false}
      CHATBOT_TELEGRAM_ENABLED: ${CHATBOT_TELEGRAM_ENABLED:-false}
      CHATBOT_TELEGRAM_BOT_TOKEN: ${CHATBOT_TELEGRAM_BOT_TOKEN:-}
      CHATBOT_TELEGRAM_SECRET_TOKEN: ${CHATBOT_TELEGRAM_SECRET_TOKEN:-}
      CHATBOT_TELEGRAM_BOT_USERNAME: ${CHATBOT_TELEGRAM_BOT_USERNAME:-}
      CHATBOT_PUBLIC_BASE_URL: ${CHATBOT_PUBLIC_BASE_URL:-}
      APP_STORAGE_TYPE: ${APP_STORAGE_TYPE:-local}
      # У контейнері завжди volume; не беріть ./data/uploads з .env (це для локального mvn).
      APP_STORAGE_LOCAL_BASE_PATH: /data/uploads
      APP_STORAGE_S3_ENDPOINT: ${APP_STORAGE_S3_ENDPOINT:-http://minio:9000}
      APP_STORAGE_S3_REGION: ${APP_STORAGE_S3_REGION:-us-east-1}
      APP_STORAGE_S3_BUCKET: ${APP_STORAGE_S3_BUCKET:-tms-uploads}
      APP_STORAGE_S3_ACCESS_KEY: ${APP_STORAGE_S3_ACCESS_KEY:-minioadmin}
      APP_STORAGE_S3_SECRET_KEY: ${APP_STORAGE_S3_SECRET_KEY:-minioadmin}
      APP_STORAGE_S3_PATH_STYLE: ${APP_STORAGE_S3_PATH_STYLE:-true}
    volumes:
      - backend_uploads:/data/uploads
    ports:
      - "${SERVER_HOST_PORT:-8090}:8080"

  # Production-збірка frontend, що віддається через nginx у контейнері
  frontend:
    build:
      context: ./frontend-angular
      dockerfile: Dockerfile
      args:
        FRONTEND_BUILD_CONFIGURATION: ${FRONTEND_BUILD_CONFIGURATION:-production}
    container_name: tms-v5-frontend
    depends_on:
      - backend
    environment:
      CARTO_API_KEY: ${CARTO_API_KEY:-}
    ports:
      - "${FRONTEND_PORT:-4210}:80"

  # Єдина точка входу (reverse proxy) для backend і frontend
  gateway:
    image: nginx:1.27-alpine
    container_name: tms-v5-gateway
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx.gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${GATEWAY_PORT:-8091}:80"

  # Публічний тунель лише для backend API (режим PUBLIC_ACCESS_MODE=ngrok).
  # Увімкнення: COMPOSE_PROFILES=ngrok у .env або --profile ngrok.
  # Режим static-ip: без профілю ngrok; порт SERVER_PORT вже опублікований на хості.
  ngrok:
    profiles:
      - ngrok
    image: ngrok/ngrok:latest
    container_name: tms-v5-ngrok
    depends_on:
      - backend
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command: http --url=${NGROK_DOMAIN} backend:8080
    ports:
      - "${NGROK_INSPECT_PORT:-4042}:4040"

volumes:
  # Персистентне сховище даних MySQL. Фіксоване ім'я — окремо від volume v1.
  mysql_data:
    name: tms-geosun-v5_mysql_data
  backend_uploads:
  minio_data:
